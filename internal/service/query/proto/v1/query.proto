syntax = "proto3";

package neodb.query.v1;

option go_package = "github.com/cirius-go/neodb/internal/service/query/proto/v1;queryv1";

import "v1/result.proto"; // For RowBatch, ExecResult

service QueryService {
  // ExecuteStream is for SELECTs that return rows
  rpc ExecuteStream(ExecuteRequest) returns (stream neodb.result.v1.RowBatch);
  // ExecuteExec is for INSERT/UPDATE/DELETE
  rpc ExecuteExec(ExecuteRequest) returns (neodb.result.v1.ExecResult);
}

message ExecuteRequest { string session_id = 1; string sql = 2; }
