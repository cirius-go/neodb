syntax = "proto3";

package neodb.connection.v1;

option go_package = "github.com/cirius-go/neodb/internal/service/connection/proto/v1;connectionv1";

service ConnectionService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
}

message ConnectionProfile {
  string id = 1;
  string name = 2;
  string driver = 3;
  string host = 4;
  int32 port = 5;
  string user = 6;
  string password = 7;
  string database = 8;
  map<string, string> properties = 9;
}

message CreateProfileRequest { ConnectionProfile profile = 1; }
message CreateProfileResponse { string id = 1; }
message ListProfilesRequest {}
message ListProfilesResponse { repeated ConnectionProfile profiles = 1; }
message TestConnectionRequest { ConnectionProfile profile = 1; }
message TestConnectionResponse { bool success = 1; string error = 2; }
