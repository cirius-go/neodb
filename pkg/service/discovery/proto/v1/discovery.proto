syntax = "proto3";

package neodb.discovery.v1;

option go_package = "protogen/v1;discoveryv1";

message TableInfo { string name = 1; string schema = 2; string type = 3; }
message ColumnInfo { string name = 1; string type = 2; bool is_nullable = 3; bool is_primary_key = 4; }

service DiscoveryService {
  rpc GetTables(GetTablesRequest) returns (GetTablesResponse);
  rpc GetColumns(GetColumnsRequest) returns (GetColumnsResponse);
}

message GetTablesRequest { string session_id = 1; string schema = 2; }
message GetTablesResponse { repeated TableInfo tables = 1; }
message GetColumnsRequest { string session_id = 1; string table_name = 2; string schema = 3; }
message GetColumnsResponse { repeated ColumnInfo columns = 1; }
