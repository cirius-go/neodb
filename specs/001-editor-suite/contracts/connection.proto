syntax = "proto3";

package neodb.connection.v1;

option go_package = "github.com/cirius-go/neodb/pkg/service/connection/v1;connectionv1";

service ConnectionService {
  // Config Management
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc SaveProfile(SaveProfileRequest) returns (SaveProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);

  // Active Connection
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message Profile {
  string id = 1;
  string name = 2;
  string driver = 3; // postgres, mysql, sqlite
  string host = 4;
  int32 port = 5;
  string user = 6;
  string password = 7; // Write-only in requests usually
  string database = 8;
  string ssl_mode = 9;
}

message ListProfilesRequest {}
message ListProfilesResponse { repeated Profile profiles = 1; }

message SaveProfileRequest { Profile profile = 1; }
message SaveProfileResponse { Profile profile = 1; }

message DeleteProfileRequest { string id = 1; }
message DeleteProfileResponse {}

message ConnectRequest { string profile_id = 1; }
message ConnectResponse { string session_id = 1; }

message DisconnectRequest { string session_id = 1; }
message DisconnectResponse {}

message GetStatusRequest { string session_id = 1; }
message GetStatusResponse { bool connected = 1; int64 uptime_seconds = 2; }
