syntax = "proto3";

package neodb.query.v1;

option go_package = "github.com/cirius-go/neodb/pkg/service/query/v1;queryv1";

service QueryService {
  // Execute runs a SQL statement. 
  // For SELECT, it streams rows.
  // For Exec, it returns a single result with rows_affected.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);
  
  // Cancel attempts to stop a running query
  rpc Cancel(CancelRequest) returns (CancelResponse);
}

message ExecuteRequest {
  string session_id = 1;
  string sql = 2;
}

message ExecuteResponse {
  oneof result {
    Header header = 1; // Sent first
    Row row = 2;       // Sent for each row
    Footer footer = 3; // Sent last (summary)
  }
}

message Header {
  repeated ColumnDefinition columns = 1;
}

message ColumnDefinition {
  string name = 1;
  string type = 2;
}

message Row {
  repeated Value values = 1;
}

message Value {
  oneof kind {
    string string_value = 1; // Default for text/varchar
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    bool is_null = 6;
  }
}

message Footer {
  int64 rows_affected = 1;
  int64 duration_ms = 2;
  string error = 3; // If query failed mid-stream
}

message CancelRequest { string session_id = 1; }
message CancelResponse { bool success = 1; }
