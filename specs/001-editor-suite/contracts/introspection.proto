syntax = "proto3";

package neodb.introspection.v1;

option go_package = "github.com/cirius-go/neodb/pkg/service/introspection/v1;introspectionv1";

service IntrospectionService {
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  rpc GetTableDetails(GetTableDetailsRequest) returns (GetTableDetailsResponse);
}

message ListSchemasRequest { string session_id = 1; }
message ListSchemasResponse { repeated string schemas = 1; }

message ListTablesRequest { 
  string session_id = 1; 
  string schema = 2; // Optional, defaults to "public" or similar
}

message ListTablesResponse { repeated TableSummary tables = 1; }

message TableSummary {
  string name = 1;
  string type = 2; // TABLE, VIEW, MATERIALIZED VIEW
}

message GetTableDetailsRequest {
  string session_id = 1;
  string schema = 2;
  string table = 3;
}

message GetTableDetailsResponse {
  string name = 1;
  repeated ColumnDetail columns = 2;
  repeated Constraint constraints = 3;
}

message ColumnDetail {
  string name = 1;
  string type = 2;
  bool is_nullable = 3;
  string default_value = 4;
  bool is_primary_key = 5;
}

message Constraint {
  string name = 1;
  string type = 2; // PRIMARY KEY, FOREIGN KEY, UNIQUE, CHECK
  string definition = 3;
}
